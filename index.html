<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GoldenAI — Мультимодальный помощник</title>
    <style>
        :root { --primary: #FFD700; --bg: #1a1a2e; --card: #162131; --text: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary); text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        
        /* Вкладки */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px; cursor: pointer; border-radius: 6px; transition: all 0.3s; }
        .tab-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }

        /* Контент вкладок */
        .tab-content { display: none; animation: fadeIn 0.5s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 12px; background: var(--card); border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }

        button { background: var(--primary); color: black; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }

        .output-box { background: #0f172a; padding: 15px; border-left: 4px solid var(--primary); margin-top: 20px; white-space: pre-wrap; line-height: 1.5; }
        .status { margin-top: 10px; font-size: 0.9em; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ GoldenAI</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('chat')">💬 Чат (Текст)</button>
        <button class="tab-btn" onclick="switchTab('image')">🖼️ Картинка</button>
        <button class="tab-btn" onclick="switchTab('video')">🎬 Видео-промпт</button>
    </div>

    <!-- Вкладка 1: Текст -->
    <div id="chat" class="tab-content active">
        <div class="form-group">
            <label for="chatInput">Ваш вопрос:</label>
            <textarea id="chatInput" placeholder="Например: Объясни квантовую физику простыми словами..."></textarea>
        </div>
        <button onclick="generateChat()">Получить ответ</button>
        <div id="chatOutput" class="output-box"></div>
    </div>

    <!-- Вкладка 2: Картинка -->
    <div id="image" class="tab-content">
        <div class="form-group">
            <label for="imgDesc">Что нужно на картинке? (описание):</label>
            <input type="text" id="imgDesc" placeholder="Чашка кофе, пар, минимализм, тёплые тона...">
        </div>
        <div class="form-group">
            <label for="imgStyle">Стиль (опционально):</label>
            <input type="text" id="imgStyle" placeholder="photorealistic, anime, vector, oil painting...">
        </div>
        <button onclick="generateImage()">Сгенерировать промпт</button>
        <div id="imgOutput" class="output-box"></div>
    </div>

    <!-- Вкладка 3: Видео -->
    <div id="video" class="tab-content">
        <div class="form-group">
            <label for="vidScene">Сцена (что происходит):</label>
            <input type="text" id="vidScene" placeholder="Чашка кофе на столе, поднимается пар...">
        </div>
        <div class="form-group">
            <label for="vidCamera">Камера и ракурс:</label>
            <input type="text" id="vidCamera" placeholder="Крупный план, статичная камера...">
        </div>
        <div class="form-group">
            <label for="vidMotion">Движение (что должно двигаться):</label>
            <input type="text" id="vidMotion" placeholder="Пар плавно поднимается, свет меняется...">
        </div>
        <button onclick="generateVideo()">Сгенерировать промпт для видео</button>
        <div id="vidOutput" class="output-box"></div>
    </div>
</div>

<script>
    // Переключение вкладок
    function switchTab(tabName) {
        // Скрываем все вкладки
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

        // Показываем нужную
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    // Логика чата (имитация нейросети)
    function generateChat() {
        const input = document.getElementById('chatInput').value.trim();
        const output = document.getElementById('chatOutput');
        
        if (!input) {
            output.innerText = "Пожалуйста, напишите вопрос!";
            return;
        }

        output.innerHTML = "<b>GoldenAI (Текст):</b> Я думаю над твоим вопросом про «" + input + "»... Вот что я предлагаю:<br><br>";
        output.innerHTML += "1. Разберём суть: " + input.toLowerCase() + " — это сложная тема, но давай упростим.<br>";
        output.innerHTML += "2. Пример аналогии: представь, что это как... ну, скажем, как заваривание чая: сначала сухие листья, потом горячая вода, и вот он — результат.<br>";
        output.innerHTML += "3. Практический шаг: попробуй сделать [действие, связанное с темой], и посмотри на результат.";
        output.innerHTML += "<br><span class='status'>Это демо-ответ. В реальном проекте тут был бы вызов API LLM.</span>";
    }

    // Логика генерации промпта для картинки
    function generateImage() {
        const desc = document.getElementById('imgDesc').value || "красивый пейзаж";
        const style = document.getElementById('imgStyle').value || "photorealistic";
        const output = document.getElementById('imgOutput');

        const prompt = `[GoldenAI (Изображение)]\nНарисуй: ${desc}\nСтиль: ${style}\nДетали: кинематографичное освещение, высокая детализация, 8k, без текста на изображении.`;
        
        output.innerText = prompt;
    }

    // Логика генерации промпта для видео
    function generateVideo() {
        const scene = document.getElementById('vidScene').value || "абстрактные формы";
        const camera = document.getElementById('vidCamera').value || "статичная камера";
        const motion = document.getElementById('vidMotion').value || "плавное движение";
        const output = document.getElementById('vidOutput');

        const prompt = `[GoldenAI (Видео)]\nСцена: ${scene}\nКамера: ${camera}\nДвижение: ${motion}\nСтиль: кинематографичный, тёплый тон\nДлительность: 4-5 секунд. Сохранение объектов между кадрами.`;

        output.innerText = prompt;
    }
</script>

</body>
</html>
